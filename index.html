<header><h1>POLAR·PATTERN EXPLORER</h1><span class="model"><span class="screw"></span>&nbsp; MICROPHONE ANALYZER · MODEL PX-76 &nbsp;<span class="screw"></span></span></header>

<script>
const C=343,BANDS=[125,1000,4000,8000,16000],BCOL=['#b3361f','#1f4e79','#4f6b1a','#b5761a','#6b2e5f'];
const T={ink:'#2b1d10',dim:'#5c4630',grid:'rgba(70,45,20,.28)',gridS:'rgba(70,45,20,.55)',red:'#b3361f',
 ideal:'79,107,26',usable:'181,118,26',out:'179,54,31',F:"'Barlow Condensed',sans-serif"};
const P={
omni:{n:"Omnidirectional",A:[1,1,.95,.85,.7],eq:"p(θ) = 1",nul:"none",d:{podcast:15,lav:22,boom:45},
note:"No proximity effect (pressure transducer). Narrows above ~4–8 kHz as wavelength nears capsule size.",
mics:[["DPA 4060","Condenser (pre-polarized), miniature lav","20 Hz–20 kHz",[[20,0],[1000,0],[8000,2],[12000,3],[20000,2]],"Broadcast/TV lav standard; soft grid +3 dB 8–20 kHz, high-boost grid +10 dB @12 kHz for chest."],
["Sanken COS-11D","Condenser (self-polarized) lav","50 Hz–20 kHz",[[20,-8],[50,-3],[1000,0],[6000,3],[10000,2],[20000,-2]],"Film/TV production lav; small presence boost near 6 kHz."],
["Sony ECM-77B","Electret condenser lav","40 Hz–20 kHz",[[20,-6],[40,-2],[1000,0],[5000,1],[10000,2],[20000,-2]],"Classic news-anchor tie-clip lav."],
["Countryman B6","Condenser lav","20 Hz–20 kHz",[[20,0],[1000,0],[8000,2],[15000,4],[20000,2]],"Smallest lav; 0/+4/+8 dB HF caps (+4 shown)."],
["Tram TR50","Electret condenser lav","40–16,000 Hz (distributor spec)",[[20,-8],[40,-3],[1000,0],[6000,3],[12000,3],[16000,-3]],"Classic plant/tie-bar lav; ~3–4 dB HF lift."]]},
cardioid:{n:"Cardioid",A:[.62,.5,.48,.42,.38],eq:"p(θ) = 0.5 + 0.5·cosθ",nul:"180°",d:{podcast:10,lav:22,boom:60},
note:"Opens toward subcardioid at LF, narrows at HF. Proximity effect below ~200 Hz when close.",
mics:[["Shure SM7B","Dynamic","50 Hz–20 kHz",[[20,-14],[50,-6],[100,-1],[1000,0],[4000,1],[7000,1.5],[10000,0],[15000,-3],[20000,-8]],"Podcast/broadcast reference; switchable presence boost and bass roll-off."],
["Electro-Voice RE20","Dynamic (Variable-D)","45 Hz–18 kHz",[[20,-12],[45,-4],[80,-1],[1000,0],[6000,1],[10000,2],[14000,0],[18000,-5]],"Radio booth standard; minimal proximity effect; bass-tilt switch."],
["Heil PR 40","Dynamic","28 Hz–18 kHz",[[20,-8],[28,-3],[100,1],[1000,0],[3000,2],[6000,3],[12000,0],[18000,-5]],"Podcast/sports broadcast; −40 dB rear rejection (Heil)."],
["Shure SM58","Dynamic","50–15,000 Hz",[[20,-18],[50,-8],[100,-3],[1000,0],[3000,3],[5000,5],[8000,2],[10000,3],[15000,-5],[20000,-14]],"Handheld reporter mic; brightened midrange, bass roll-off."],
["Neumann U 87 Ai","Condenser (large diaphragm, multi-pattern)","20 Hz–20 kHz",[[20,-6],[40,-2],[100,0],[1000,0],[5000,0],[10000,2],[15000,0],[20000,-4]],"VO/announce studio standard (cardioid mode)."]]},
super:{n:"Supercardioid",A:[.45,.37,.37,.34,.3],eq:"p(θ) = 0.37 + 0.63·cosθ",nul:"≈126°",d:{podcast:15,lav:22,boom:60},
note:"Rear −11.7 dB, acceptance ≈115°. Preferred indoor dialogue boom.",
mics:[["Schoeps CMC 641 (MK 41)","Condenser","40 Hz–20 kHz",[[20,-8],[40,-3],[1000,0],[10000,1],[20000,-1]],"'International standard for indoor film sound' (Schoeps)."],
["Sennheiser MKH 50","RF condenser","40–20,000 Hz",[[20,-10],[40,-3],[1000,0],[5000,1],[10000,2],[20000,0]],"Interior boom; frequency-independent pattern; roll-off for 0.5 m proximity."]]},
hyper:{n:"Hypercardioid",A:[.33,.25,.25,.22,.2],eq:"p(θ) = 0.25 + 0.75·cosθ",nul:"≈110° (109.5°)",d:{podcast:15,lav:22,boom:50},
note:"Max first-order directivity (DI 6 dB); rear lobe −6 dB; acceptance ≈105°.",
mics:[["Audio-Technica AT4053b","Condenser (externally polarized)","20–20,000 Hz",[[20,-3],[1000,0],[8000,1],[15000,0],[20000,-3]],"Indoor dialogue boom; 80 Hz low-cut switch."]]},
fig8:{n:"Figure-8",A:[0,0,0,0,0],eq:"p(θ) = cosθ",nul:"90° / 270°",d:{podcast:20,lav:0,boom:0},
note:"Front and rear equal (rear inverted polarity). Strongest proximity effect.",
mics:[["Royer R-121","Ribbon (passive)","30–15,000 Hz ±3 dB",[[20,-5],[30,-2],[1000,0],[8000,-1],[15000,-4],[20000,-10]],"Warm two-person interviews; nulls toward noise."],
["Neumann U 87 Ai (fig-8)","Condenser","20 Hz–20 kHz",[[20,-12],[60,-5],[120,-1],[1000,0],[5000,2],[10000,1],[20000,-5]],"Face-to-face hosts on one mic."]]},
shotgun:{n:"Shotgun / Lobar",A:[.35,.3,.3,.3,.3],L:.18,eq:"p = (A + B·cosθ)·sinc[(πLf/c)(1−cosθ)]",nul:"LF ≈110–126°; HF multiple lobes",d:{podcast:45,lav:0,boom:75},
note:"Super/hyper below ~c/2L (~1 kHz), lobar above. Ideal boom 2–3 ft overhead (Audio-Technica).",
mics:[["Sennheiser MKH 416","RF condenser","40–20,000 Hz",[[20,-10],[40,-3],[100,-1],[1000,0],[3000,1],[7000,3],[12000,4],[20000,0]],"ENG/film/VO workhorse; rising HF, low proximity effect."],
["Neumann KMR 81 i","Condenser","20 Hz–20 kHz",[[20,-6],[50,-1],[1000,0],[2000,0],[5000,2],[10000,3],[16000,2],[20000,-2]],"Film dialogue; linear to 2 kHz then treble lift; 200 Hz low cut."],
["RØDE NTG3","RF-bias condenser","40 Hz–20 kHz",[[20,-10],[40,-3],[1000,0],[5000,1],[10000,2],[20000,-2]],"Moisture-resistant outdoor boom."],
["Sennheiser MKH 60","RF condenser","50–20,000 Hz",[[20,-12],[50,-3],[1000,0],[8000,1],[20000,-1]],"Short shotgun with presence (treble) switch."]]}};
const FLAG={omni:"DPA 4060 lavalier (shown enlarged)",cardioid:"Shure SM7B on boom arm",super:"Schoeps CMC 641 in shock mount",hyper:"Audio-Technica AT4053b in shock mount",fig8:"Royer R-121 ribbon (side-address)",shotgun:"Sennheiser MKH 416 on pistol grip"};
const ROT=Math.PI/4; // 0° axis points up-right (45°)
let pat='cardioid',band=1,mic=0,t=0;
const $=id=>document.getElementById(id);
function patVal(k,f,th){const p=P[k];let i=BANDS.indexOf(f);let A=i>=0?p.A[i]:interpA(p.A,f);let v=A+(1-A)*Math.cos(th);
 if(p.L){const x=Math.PI*p.L*f/C*(1-Math.cos(th));v*=x<1e-6?1:Math.sin(x)/x;}return v;}
function interpA(a,f){const lf=Math.log10(f);for(let i=0;i<4;i++){const l0=Math.log10(BANDS[i]),l1=Math.log10(BANDS[i+1]);if(lf<=l1)return a[i]+(a[i+1]-a[i])*Math.max(0,(lf-l0)/(l1-l0));}return a[4];}
const db=v=>20*Math.log10(Math.max(Math.abs(v),1e-4));
const fl=f=>f>=1000?f/1000+' kHz':f+' Hz';
function ui(){$('pats').innerHTML=Object.keys(P).map(k=>`<button class="${k==pat?'on':''}" onclick="pat='${k}';mic=0;ui()">${P[k].n}</button>`).join('');
 $('bands').innerHTML=BANDS.map((f,i)=>`<button class="${i==band?'on':''}" onclick="band=${i};ui()">${fl(f)}<span class="sw" style="background:${BCOL[i]}"></span></button>`).join('');
 $('mic').innerHTML=P[pat].mics.map((m,i)=>`<option value="${i}" ${i==mic?'selected':''}>${m[0]}</option>`).join('');drawFR();}
$('mic').onchange=e=>{mic=+e.target.value;drawFR();};$('use').onchange=drawFR;

function pol(cx,cy,r,th){return [cx+r*Math.sin(th+ROT),cy-r*Math.cos(th+ROT)];}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function metal(g,y0,y1,a,b){const gr=g.createLinearGradient(0,y0,0,y1);gr.addColorStop(0,b);gr.addColorStop(.35,a);gr.addColorStop(1,b);return gr;}
// warm backlit "meter paper" background
function paper(g,W,H,cx,cy){const gr=g.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.75);
 gr.addColorStop(0,'#fbf0cf');gr.addColorStop(.55,'#efd79d');gr.addColorStop(1,'#c99a55');g.fillStyle=gr;g.fillRect(0,0,W,H);}

// Mic drawn in local coords: front (0° side) at x=0, body extends toward -x.
function drawMic(g,x,y){
 g.save();g.translate(x,y);g.rotate(ROT-Math.PI/2);g.scale(.8,.8);g.lineWidth=1.2;g.strokeStyle='#0004';
 if(pat==='cardioid'){ // Shure SM7B
  g.strokeStyle='#3a3f4a';g.lineWidth=7;g.beginPath();g.moveTo(-128,40);g.lineTo(-215,100);g.stroke();
  g.lineWidth=5;g.strokeStyle='#4a505c';g.beginPath();g.moveTo(-128,20);g.lineTo(-128,44);g.stroke();
  g.fillStyle=metal(g,-24,24,'#3b3f47','#1d1f24');g.beginPath();g.moveTo(-74,-24);g.lineTo(-176,-18);g.lineTo(-176,18);g.lineTo(-74,24);g.closePath();g.fill();g.stroke();
  g.fillStyle='#16181c';g.fillRect(-188,-13,12,26);g.fillStyle='#888';g.fillRect(-194,-7,6,14);
  g.fillStyle='#5b6170';g.beginPath();g.arc(-128,20,8,0,7);g.fill();
  g.fillStyle=metal(g,-31,31,'#2d3038','#16181c');rr(g,-80,-31,80,62,24);g.fill();g.lineWidth=1;g.strokeStyle='#000';g.stroke();
  g.fillStyle='#ffffff10';for(let i=-72;i<-4;i+=7)for(let j=-24;j<26;j+=7)g.fillRect(i,j,2,2);
 }else if(pat==='omni'){ // DPA 4060 lav (enlarged)
  g.strokeStyle='#202226';g.lineWidth=5;g.beginPath();g.moveTo(-38,0);g.bezierCurveTo(-110,10,-120,70,-200,60);g.stroke();
  g.fillStyle='#55595f';g.fillRect(-46,9,34,8);for(let i=-44;i<-12;i+=5){g.fillStyle='#33363b';g.fillRect(i,17,3,5);}
  g.fillStyle=metal(g,-11,11,'#2a2c30','#0d0e10');rr(g,-40,-11,40,22,5);g.fill();
  g.fillStyle='#6a6f78';g.fillRect(-5,-10,5,20);g.fillStyle='#ffffff22';for(let j=-8;j<9;j+=3)g.fillRect(-4,j,3,1);
 }else if(pat==='super'||pat==='hyper'){ // Schoeps CMC 641 / AT4053b pencil in shock mount
  const sch=pat==='super';
  g.strokeStyle='#3a3f4a';g.lineWidth=6;g.beginPath();g.moveTo(-125,30);g.lineTo(-125,70);g.lineTo(-230,70);g.stroke();
  g.fillStyle=metal(g,-11,11,sch?'#8b9098':'#34373d',sch?'#4f535a':'#15171a');g.fillRect(-205,-11,157,22);
  g.fillStyle='#777';g.fillRect(-212,-6,7,12);
  g.fillStyle=sch?'#9aa0a8':'#55585f';g.fillRect(-50,-12,4,24);
  g.fillStyle=metal(g,-13,13,sch?'#b3b8bf':'#40434a',sch?'#6c7179':'#1b1d21');rr(g,-46,-13,46,26,6);g.fill();
  g.fillStyle='#0008';for(let i=-40;i<-4;i+=5)g.fillRect(i,-10,2,20);
  g.lineWidth=2;g.strokeStyle='#8a6a25';[-85,-165].forEach(cx=>{g.beginPath();g.ellipse(cx,0,5,24,0,0,7);g.stroke();g.beginPath();g.moveTo(cx,24);g.lineTo(-125,30);g.stroke();});
 }else if(pat==='fig8'){ // Royer R-121 side-address, front face toward +x
  g.strokeStyle='#4a505c';g.lineWidth=6;g.beginPath();g.moveTo(-14,58);g.lineTo(-14,96);g.lineTo(-60,96);g.stroke();
  const gr=g.createLinearGradient(-28,0,0,0);gr.addColorStop(0,'#7d828a');gr.addColorStop(.5,'#d7dbe0');gr.addColorStop(1,'#8d9299');g.fillStyle=gr;
  rr(g,-28,-96,28,154,12);g.fill();g.lineWidth=1;g.strokeStyle='#000';g.stroke();
  g.fillStyle='#0007';for(let j=-84;j<12;j+=5)g.fillRect(-24,j,20,2);
 }else{ // shotgun: Sennheiser MKH 416 on pistol grip
  g.fillStyle='#2a2c31';g.beginPath();g.moveTo(-178,14);g.lineTo(-188,80);g.lineTo(-166,80);g.lineTo(-160,14);g.closePath();g.fill();
  g.strokeStyle='#555';g.lineWidth=3;[-150,-215].forEach(cx=>{g.beginPath();g.moveTo(cx,-14);g.lineTo(cx,14);g.lineTo(-170,14);g.stroke();});
  g.fillStyle=metal(g,-10,10,'#9ea3ab','#5a5f66');g.fillRect(-250,-10,250,20);
  g.fillStyle='#4a4e55';g.fillRect(-250,-10,48,20);g.fillStyle='#777';g.fillRect(-258,-6,8,12);
  g.fillStyle='#0009';for(let i=-196;i<-12;i+=9){g.fillRect(i,-8,5,3);g.fillRect(i+4,4,5,3);}
  g.fillStyle='#3d4148';g.fillRect(-6,-10,6,20);
 }
 g.restore();
}
function drawPolar(){const c=$('polar'),g=c.getContext('2d'),W=c.width,H=c.height,cx=340,cy=350,R=210;
 paper(g,W,H,cx,cy);
 g.lineWidth=1;g.textAlign='center';g.font=`13px ${T.F}`;
 for(let d=0;d<=30;d+=10){g.strokeStyle=d==0?T.gridS:T.grid;g.beginPath();g.arc(cx,cy,R*(1-d/30),0,7);g.stroke();}
 for(let a=0;a<360;a+=10){const th=a*Math.PI/180,[x0,y0]=pol(cx,cy,R,th),[x1,y1]=pol(cx,cy,R+(a%30?5:9),th);g.strokeStyle=T.gridS;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();}
 for(let a=0;a<360;a+=30){const th=a*Math.PI/180,[x,y]=pol(cx,cy,R,th);g.strokeStyle=T.grid;g.beginPath();g.moveTo(cx,cy);g.lineTo(x,y);g.stroke();
  const [lx,ly]=pol(cx,cy,R+22,th);g.fillStyle=a==0?T.red:T.ink;g.font=`600 14px ${T.F}`;g.fillText(a+'°',lx,ly+5);}
 g.font=`12px ${T.F}`;g.fillStyle=T.dim;for(let d=0;d<30;d+=10){const [x,y]=pol(cx,cy,R*(1-d/30),Math.PI/2);g.fillText('−'+d+' dB',x-4,y-6);}
 // vocal pickup zones
 if(pat!=='omni'){const base=ROT-Math.PI/2,dirs=pat==='fig8'?[0,Math.PI]:[0];
  dirs.forEach(d=>{[[60,`rgba(${T.usable},.16)`],[30,`rgba(${T.ideal},.2)`]].forEach(([a,col])=>{const r=a*Math.PI/180;
   g.fillStyle=col;g.beginPath();g.moveTo(cx,cy);g.arc(cx,cy,R,base+d-r,base+d+r);g.closePath();g.fill();});});
  g.font=`600 12px ${T.F}`;[[30,T.ideal,'IDEAL'],[60,T.usable,'USABLE']].forEach(([a,col,txt])=>{const [lx,ly]=pol(cx,cy,R-14,-a*Math.PI/180);g.fillStyle=`rgb(${col})`;g.fillText(txt,lx,ly);});}
 // on-axis line through the capsule
 const [bx,by]=pol(cx,cy,R,Math.PI),[fx,fy]=pol(cx,cy,R,0);
 g.setLineDash([6,6]);g.strokeStyle='rgba(179,54,31,.6)';g.beginPath();g.moveTo(bx,by);g.lineTo(fx,fy);g.stroke();g.setLineDash([]);
 const [ox,oy]=pol(cx,cy,R+44,0);g.fillStyle=T.red;g.font=`11px Michroma,${T.F}`;g.fillText('ON-AXIS',ox,oy);
 g.globalAlpha=.95;drawMic(g,cx,cy);g.globalAlpha=1;
 BANDS.forEach((f,i)=>{g.beginPath();for(let a=0;a<=360;a++){const th=a*Math.PI/180,r=R*Math.max(0,(db(patVal(pat,f,th))+30)/30),[x,y]=pol(cx,cy,r,th);a?g.lineTo(x,y):g.moveTo(x,y);}
  g.strokeStyle=BCOL[i];g.globalAlpha=i==band?1:.35;g.lineWidth=i==band?2.8:1.2;g.stroke();if(i==band){g.fillStyle=BCOL[i]+'26';g.fill();}g.globalAlpha=1;g.lineWidth=1;});
 const use=$('use').value,rec=P[pat].d[use];g.setLineDash([3,5]);g.strokeStyle=T.ink;g.globalAlpha=.6;g.beginPath();g.arc(cx,cy,R*0.5,0,7);g.stroke();g.globalAlpha=1;g.setLineDash([]);
 g.textAlign='left';
 // animated source
 const th=t*0.5,dd=rec?rec*(1+0.7*Math.sin(t*0.8)):30,rad=R*0.5*dd/(rec||30),[sx,sy]=pol(cx,cy,rad,th);
 const f=BANDS[band],lvl=db(patVal(pat,f,th))+20*Math.log10((rec||30)/dd);
 let off=Math.acos(Math.cos(th))*180/Math.PI;if(pat==='fig8')off=Math.min(off,180-off);
