<!DOCTYPE html><html><head><meta charset="utf-8"><title>Mic Polar Pattern Explorer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Barlow+Condensed:wght@400;600&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b1d10;--amber:#ffb000;--alu1:#dcdcd8;--alu2:#b4b5b0}
*{box-sizing:border-box}
html{background:#24130a}
body{margin:0;min-height:100vh;padding:24px 16px;font:15px 'Barlow Condensed',sans-serif;color:var(--ink);background-color:#24130a;
 background-image:repeating-linear-gradient(93deg,rgba(0,0,0,.18) 0 2px,transparent 2px 9px,rgba(255,200,140,.05) 9px 11px,transparent 11px 23px),linear-gradient(#3d2210,#24130a)}
.cabinet{max-width:1680px;margin:0 auto;padding:18px 26px;border-radius:10px;
 background:#5a3418 repeating-linear-gradient(88deg,rgba(0,0,0,.22) 0 1px,transparent 1px 6px,rgba(255,190,120,.08) 6px 8px,transparent 8px 17px);
 box-shadow:0 18px 40px #000a,inset 0 1px 0 #ffffff22}
.face{border-radius:4px;padding:16px 18px 18px;
 background:repeating-linear-gradient(90deg,rgba(255,255,255,.10) 0 1px,rgba(0,0,0,.035) 1px 2px,transparent 2px 3px),linear-gradient(180deg,var(--alu1),var(--alu2));
 box-shadow:inset 0 1px 0 #fff,inset 0 -2px 0 #0003,0 2px 6px #0008}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:1px solid #8a8a85;padding-bottom:10px;margin-bottom:14px;box-shadow:0 1px 0 #fff}
h1{font:16px 'Michroma',sans-serif;letter-spacing:.18em;margin:0;color:#1b1b1b;text-shadow:0 1px 0 #fff8}
.model{font:10px 'Michroma',sans-serif;letter-spacing:.3em;color:#555}
.wrap{display:grid;grid-template-columns:240px 1fr 1.2fr;gap:18px}
@media(max-width:1000px){.wrap{grid-template-columns:1fr}}
.lbl{font:10px 'Michroma',sans-serif;letter-spacing:.22em;text-transform:uppercase;color:#333;margin:12px 0 6px;text-shadow:0 1px 0 #fff8}
.lbl:first-child{margin-top:0}
.hint{font:12px 'Barlow Condensed',sans-serif;color:#444;margin:-2px 0 4px}
button{display:flex;align-items:center;gap:9px;width:100%;margin:3px 0;padding:7px 10px;cursor:pointer;text-align:left;
 font:600 15px 'Barlow Condensed',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#e9dcc0;
 background:linear-gradient(#3b3b3b,#1d1d1d);border:1px solid #000;border-radius:3px;box-shadow:inset 0 1px 0 #ffffff26,0 2px 0 #0006}
button:active{transform:translateY(1px);box-shadow:inset 0 1px 0 #fff2}
button::before{content:'';flex:0 0 9px;height:9px;border-radius:50%;background:#3a2a10;box-shadow:inset 0 1px 2px #000}
button.on::before{background:var(--amber);box-shadow:0 0 8px var(--amber),inset 0 -1px 2px #a65f00}
button.on{color:#fff3d6}
button .sw{width:16px;height:4px;margin-left:auto;border-radius:1px}
button .rate{margin-left:auto;font-size:12px;letter-spacing:.12em;color:#ffb000}
button .rate .off{color:#5a4a30}
button .rate.na{color:#7a6a50;letter-spacing:.04em}
select{width:100%;padding:7px;font:600 15px 'Barlow Condensed',sans-serif;color:#1b1b1b;border:1px solid #777;border-radius:3px;
 background:linear-gradient(#f2f2ef,#c9cac5);box-shadow:inset 0 1px 0 #fff,0 1px 2px #0005}
.window{position:relative;padding:9px;border-radius:6px;background:#160f09;box-shadow:inset 0 2px 8px #000,0 1px 0 #fff}
.window canvas{display:block;width:100%;border-radius:3px}
.window::after{content:'';position:absolute;inset:9px;border-radius:3px;pointer-events:none;
 background:linear-gradient(155deg,rgba(255,255,255,.22),rgba(255,255,255,0) 38%),radial-gradient(ellipse at 50% 120%,rgba(0,0,0,.25),transparent 60%)}
.card{margin-top:12px;padding:10px 12px;font:13px/1.55 'Courier Prime',monospace;white-space:pre-wrap;color:#2a2116;
 background:#efe3c4;border-radius:2px;box-shadow:0 1px 3px #0006,inset 0 0 30px #c9b07a55}
.screw{display:inline-block;width:12px;height:12px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fafafa,#888);box-shadow:0 1px 1px #0008;position:relative}
.screw::after{content:'';position:absolute;left:2px;right:2px;top:5px;height:2px;background:#555;transform:rotate(35deg)}
</style></head><body>
<div class="cabinet"><div class="face">
<header><h1>POLAR·PATTERN EXPLORER</h1><span class="model"><span class="screw"></span>&nbsp; MICROPHONE ANALYZER · MODEL PX-76 &nbsp;<span class="screw"></span></span></header>
<div class="wrap">
<div><div class="lbl">Use case</div><select id="use"><option value="podcast">Podcast desk</option><option value="lav">Lavalier (chest)</option><option value="boom">Boom above talent</option></select>

<div><div class="window"><canvas id="fr" width="720" height="340"></canvas></div><div class="card" id="info"></div></div>
</div></div></div>
<script>
const C=343,BANDS=[125,1000,4000,8000,16000],BCOL=['#b3361f','#1f4e79','#4f6b1a','#b5761a','#6b2e5f'];
const T={ink:'#2b1d10',dim:'#5c4630',grid:'rgba(70,45,20,.28)',gridS:'rgba(70,45,20,.55)',red:'#b3361f',
 ideal:'79,107,26',usable:'181,118,26',out:'179,54,31',F:"'Barlow Condensed',sans-serif"};
const P={
omni:{n:"Omnidirectional",A:[1,1,.95,.85,.7],eq:"p(θ) = 1",nul:"none",d:{podcast:15,lav:22,boom:45},
note:"No proximity effect (pressure transducer). Narrows above ~4–8 kHz as wavelength nears capsule size.",
mics:[["DPA 4060","Condenser (pre-polarized), miniature lav","20 Hz–20 kHz",[[20,0],[1000,0],[8000,2],[12000,3],[20000,2]],"Broadcast/TV lav standard; soft grid +3 dB 8–20 kHz, high-boost grid +10 dB @12 kHz for chest."],
["Sanken COS-11D","Condenser (self-polarized) lav","50 Hz–20 kHz",[[20,-8],[50,-3],[1000,0],[6000,3],[10000,2],[20000,-2]],"Film/TV production lav; small presence boost near 6 kHz."],
["Sony ECM-77B","Electret condenser lav","40 Hz–20 kHz",[[20,-6],[40,-2],[1000,0],[5000,1],[10000,2],[20000,-2]],"Classic news-anchor tie-clip lav."],
["Countryman B6","Condenser lav","20 Hz–20 kHz",[[20,0],[1000,0],[8000,2],[15000,4],[20000,2]],"Smallest lav; 0/+4/+8 dB HF caps (+4 shown)."],
["Tram TR50","Electret condenser lav","40–16,000 Hz (distributor spec)",[[20,-8],[40,-3],[1000,0],[6000,3],[12000,3],[16000,-3]],"Classic plant/tie-bar lav; ~3–4 dB HF lift."]]},
cardioid:{n:"Cardioid",A:[.62,.5,.48,.42,.38],eq:"p(θ) = 0.5 + 0.5·cosθ",nul:"180°",d:{podcast:10,lav:22,boom:60},
note:"Opens toward subcardioid at LF, narrows at HF. Proximity effect below ~200 Hz when close.",
mics:[["Shure SM7B","Dynamic","50 Hz–20 kHz",[[20,-14],[50,-6],[100,-1],[1000,0],[4000,1],[7000,1.5],[10000,0],[15000,-3],[20000,-8]],"Podcast/broadcast reference; switchable presence boost and bass roll-off."],
["Electro-Voice RE20","Dynamic (Variable-D)","45 Hz–18 kHz",[[20,-12],[45,-4],[80,-1],[1000,0],[6000,1],[10000,2],[14000,0],[18000,-5]],"Radio booth standard; minimal proximity effect; bass-tilt switch."],
["Heil PR 40","Dynamic","28 Hz–18 kHz",[[20,-8],[28,-3],[100,1],[1000,0],[3000,2],[6000,3],[12000,0],[18000,-5]],"Podcast/sports broadcast; −40 dB rear rejection (Heil)."],
["Shure SM58","Dynamic","50–15,000 Hz",[[20,-18],[50,-8],[100,-3],[1000,0],[3000,3],[5000,5],[8000,2],[10000,3],[15000,-5],[20000,-14]],"Handheld reporter mic; brightened midrange, bass roll-off."],
["Neumann U 87 Ai","Condenser (large diaphragm, multi-pattern)","20 Hz–20 kHz",[[20,-6],[40,-2],[100,0],[1000,0],[5000,0],[10000,2],[15000,0],[20000,-4]],"VO/announce studio standard (cardioid mode)."]]},
super:{n:"Supercardioid",A:[.45,.37,.37,.34,.3],eq:"p(θ) = 0.37 + 0.63·cosθ",nul:"≈126°",d:{podcast:15,lav:22,boom:60},
note:"Rear −11.7 dB, acceptance ≈115°. Preferred indoor dialogue boom.",
mics:[["Schoeps CMC 641 (MK 41)","Condenser","40 Hz–20 kHz",[[20,-8],[40,-3],[1000,0],[10000,1],[20000,-1]],"'International standard for indoor film sound' (Schoeps)."],
["Sennheiser MKH 50","RF condenser","40–20,000 Hz",[[20,-10],[40,-3],[1000,0],[5000,1],[10000,2],[20000,0]],"Interior boom; frequency-independent pattern; roll-off for 0.5 m proximity."]]},
hyper:{n:"Hypercardioid",A:[.33,.25,.25,.22,.2],eq:"p(θ) = 0.25 + 0.75·cosθ",nul:"≈110° (109.5°)",d:{podcast:15,lav:22,boom:50},
note:"Max first-order directivity (DI 6 dB); rear lobe −6 dB; acceptance ≈105°.",
mics:[["Audio-Technica AT4053b","Condenser (externally polarized)","20–20,000 Hz",[[20,-3],[1000,0],[8000,1],[15000,0],[20000,-3]],"Indoor dialogue boom; 80 Hz low-cut switch."]]},
fig8:{n:"Figure-8",A:[0,0,0,0,0],eq:"p(θ) = cosθ",nul:"90° / 270°",d:{podcast:20,lav:0,boom:0},
note:"Front and rear equal (rear inverted polarity). Strongest proximity effect.",
mics:[["Royer R-121","Ribbon (passive)","30–15,000 Hz ±3 dB",[[20,-5],[30,-2],[1000,0],[8000,-1],[15000,-4],[20000,-10]],"Warm two-person interviews; nulls toward noise."],
["Neumann U 87 Ai (fig-8)","Condenser","20 Hz–20 kHz",[[20,-12],[60,-5],[120,-1],[1000,0],[5000,2],[10000,1],[20000,-5]],"Face-to-face hosts on one mic."]]},
shotgun:{n:"Shotgun / Lobar",A:[.35,.3,.3,.3,.3],L:.18,eq:"p = (A + B·cosθ)·sinc[(πLf/c)(1−cosθ)]",nul:"LF ≈110–126°; HF multiple lobes",d:{podcast:45,lav:0,boom:75},
note:"Super/hyper below ~c/2L (~1 kHz), lobar above. Ideal boom 2–3 ft overhead (Audio-Technica).",
mics:[["Sennheiser MKH 416","RF condenser","40–20,000 Hz",[[20,-10],[40,-3],[100,-1],[1000,0],[3000,1],[7000,3],[12000,4],[20000,0]],"ENG/film/VO workhorse; rising HF, low proximity effect."],
["Neumann KMR 81 i","Condenser","20 Hz–20 kHz",[[20,-6],[50,-1],[1000,0],[2000,0],[5000,2],[10000,3],[16000,2],[20000,-2]],"Film dialogue; linear to 2 kHz then treble lift; 200 Hz low cut."],
["RØDE NTG3","RF-bias condenser","40 Hz–20 kHz",[[20,-10],[40,-3],[1000,0],[5000,1],[10000,2],[20000,-2]],"Moisture-resistant outdoor boom."],
["Sennheiser MKH 60","RF condenser","50–20,000 Hz",[[20,-12],[50,-3],[1000,0],[8000,1],[20000,-1]],"Short shotgun with presence (treble) switch."]]}};

// Use cases: typical noise source position, pattern suitability (0–3) and placement tips
const USE={
podcast:{n:"Podcast desk",noise:{label:"CO-HOST",ang:180},
 rate:{omni:1,cardioid:3,super:2,hyper:2,fig8:2,shotgun:1},
 tip:{omni:"Only in a quiet, treated room — it hears the whole room, and your co-host, equally.",
  cardioid:"The standard. 5–15 cm from the mouth, with the rear null (180°) pointed at your co-host.",
  super:"Tighter sides. Aim a null (~126°) at the co-host rather than the back of the mic.",
  hyper:"Most side rejection, but a −6 dB rear lobe: don't sit a co-host directly behind it — use the ~110° nulls.",
  fig8:"Two hosts face to face on one mic: the co-host is in the rear lobe on purpose, and the 90° sides reject the room.",
  shotgun:"Overkill up close: the tone changes as you move off-axis, and room reflections sound hollow. Better on a boom."}},
lav:{n:"Lavalier (chest)",noise:{label:"ROOM NOISE",ang:135},
 rate:{omni:3,cardioid:2,super:0,hyper:0,fig8:0,shotgun:0},
 tip:{omni:"The broadcast default: mid-chest, 20–25 cm from the mouth. Forgiving when the head turns; add a 3–5 kHz lift in post.",
  cardioid:"Directional lavs (e.g. DPA 4080) must be aimed at the mouth; useful in loud venues or near PA speakers.",
  super:"Not made as a lavalier pattern.",hyper:"Not made as a lavalier pattern.",fig8:"Not made as a lavalier pattern.",shotgun:"Not a lavalier pattern."}},
boom:{n:"Boom above talent",noise:{label:"CAMERA / CREW",ang:125},
 rate:{omni:1,cardioid:2,super:3,hyper:3,fig8:0,shotgun:3},
 tip:{omni:"Only in very quiet interiors — it picks up the whole set.",
  cardioid:"Fine for close boom work, about 2 ft or less above talent.",
  super:"Preferred indoors (MK 41, MKH 50): narrow pickup without a shotgun's room colouration. 1–3 ft overhead.",
  hyper:"Indoors, 1–2 ft overhead. Aim the ~110° nulls at camera or HVAC, not the rear.",
  fig8:"Not used on booms — the rear lobe hears the ceiling as loudly as the talent.",
  shotgun:"Outdoors / ENG: 2–3 ft above, aimed down at the mouth so the off-axis points at ground or sky."}}};

// Which drawing to use for each example mic
const LOOK={"DPA 4060":"dpa","Sanken COS-11D":"cos11","Sony ECM-77B":"ecm77","Countryman B6":"b6","Tram TR50":"tr50",
 "Shure SM7B":"sm7b","Electro-Voice RE20":"re20","Heil PR 40":"pr40","Shure SM58":"sm58","Neumann U 87 Ai":"u87",
 "Schoeps CMC 641 (MK 41)":"schoeps","Sennheiser MKH 50":"mkh50","Audio-Technica AT4053b":"at4053",
 "Royer R-121":"r121","Neumann U 87 Ai (fig-8)":"u87",
 "Sennheiser MKH 416":"mkh416","Neumann KMR 81 i":"kmr81","RØDE NTG3":"ntg3","Sennheiser MKH 60":"mkh60"};
const MOUNT={sm7b:"on boom arm",re20:"in shock mount",pr40:"in yoke",sm58:"in stand clip",u87:"in spider shock mount (side-address)",
 schoeps:"in shock mount",mkh50:"in shock mount",at4053:"in shock mount",r121:"on stand (side-address)",
 mkh416:"on pistol grip",kmr81:"on pistol grip",ntg3:"on pistol grip",mkh60:"on pistol grip",
 dpa:"lavalier, shown enlarged",cos11:"lavalier, shown enlarged",ecm77:"tie-clip lavalier, shown enlarged",b6:"lavalier, shown enlarged",tr50:"tie-bar lavalier, shown enlarged"};

// Self-noise (equivalent noise level) and sensitivity from manufacturer spec sheets.
// n = self-noise in dB SPL (null = passive mic, no self-noise spec); w = weighting as published; s = sensitivity
const NOISE={
 "DPA 4060":{n:23,w:"dB(A) typ., max 26",s:"20 mV/Pa"},
 "Sanken COS-11D":{n:28,w:"dB-A or less",s:"17.8 mV/Pa (XLR version)"},
 "Sony ECM-77B":{n:30,w:"dB SPL or less",s:"−52 dB re 1 V/Pa (≈2.5 mV/Pa)"},
 "Countryman B6":{n:24,w:"dBA (standard sensitivity)",s:"16 mV/Pa"},
 "Tram TR50":{n:26,w:"dB SPL (weighting not stated; distributor sheet)",s:"−57 dB output (reference not stated)"},
 "Shure SM7B":{n:null,type:"dynamic",s:"−59 dBV/Pa (1.12 mV/Pa)"},
 "Electro-Voice RE20":{n:null,type:"dynamic",s:"1.5 mV/Pa"},
 "Heil PR 40":{n:null,type:"dynamic",s:"−53.9 dB @ 1 kHz"},
 "Shure SM58":{n:null,type:"dynamic",s:"−54.5 dBV/Pa (1.85 mV/Pa)"},
 "Neumann U 87 Ai":{n:12,w:"dB-A (cardioid)",s:"28 mV/Pa (cardioid)"},
 "Neumann U 87 Ai (fig-8)":{n:14,w:"dB-A (figure-8)",s:"22 mV/Pa (figure-8)"},
 "Schoeps CMC 641 (MK 41)":{n:14,w:"dB-A",s:"16 mV/Pa"},
 "Sennheiser MKH 50":{n:12,w:"dB-A",s:"25 mV/Pa"},
 "Audio-Technica AT4053b":{n:16,w:"dB SPL",s:"−34 dB re 1 V/Pa (19.9 mV/Pa)"},
 "Royer R-121":{n:null,type:"passive ribbon",s:"−50 dBV/Pa (≈3.2 mV/Pa)"},
 "Sennheiser MKH 416":{n:13,w:"dB-A (approx.)",s:"25 mV/Pa"},
 "Neumann KMR 81 i":{n:12,w:"dB-A",s:"18 mV/Pa"},
 "RØDE NTG3":{n:13,w:"dB-A",s:"−30 dB re 1 V/Pa (≈31.6 mV/Pa)"},
 "Sennheiser MKH 60":{n:8,w:"dB-A",s:"40 mV/Pa"}};
function noiseText(name){const z=NOISE[name];if(!z)return '';
 if(z.n===null)return `Self-noise:  n/a — ${z.type}, no active electronics, so no self-noise spec.\nSensitivity: ${z.s} — low output, so it needs lots of clean preamp gain; the preamp's hiss becomes the noise floor.`;
 const r=z.n<=12?'very quiet':z.n<=16?'quiet':z.n<=22?'moderate':'higher, typical of miniature capsules';
 return `Self-noise:  ${z.n} ${z.w} — ${r}\nSensitivity: ${z.s}`;}
function noiseBadge(name){const z=NOISE[name];if(!z)return '';if(z.n===null)return `SELF-NOISE n/a (${z.type.toUpperCase()})`;
 return `SELF-NOISE ${z.n} ${/^dB-?\(?A/.test(z.w)?'dB-A':'dB SPL'}`;}

const ROT=Math.PI/4; // 0° axis points up-right (45°)
let pat='cardioid',band=1,mic=0,t=0;
const $=id=>document.getElementById(id);
function patVal(k,f,th){const p=P[k];let i=BANDS.indexOf(f);let A=i>=0?p.A[i]:interpA(p.A,f);let v=A+(1-A)*Math.cos(th);
 if(p.L){const x=Math.PI*p.L*f/C*(1-Math.cos(th));v*=x<1e-6?1:Math.sin(x)/x;}return v;}
function interpA(a,f){const lf=Math.log10(f);for(let i=0;i<4;i++){const l0=Math.log10(BANDS[i]),l1=Math.log10(BANDS[i+1]);if(lf<=l1)return a[i]+(a[i+1]-a[i])*Math.max(0,(lf-l0)/(l1-l0));}return a[4];}
const db=v=>20*Math.log10(Math.max(Math.abs(v),1e-4));
const fl=f=>f>=1000?f/1000+' kHz':f+' Hz';
const stars=n=>n?'★'.repeat(n)+'<span class="off">'+'★'.repeat(3-n)+'</span>':'';
function ui(){const U=USE[$('use').value];
 $('pats').innerHTML=Object.keys(P).map(k=>{const r=U.rate[k];return `<button class="${k==pat?'on':''}" onclick="pat='${k}';mic=0;ui()">${P[k].n}<span class="rate${r?'':' na'}">${r?stars(r):'N/A'}</span></button>`;}).join('');
 $('bands').innerHTML=BANDS.map((f,i)=>`<button class="${i==band?'on':''}" onclick="band=${i};ui()">${fl(f)}<span class="sw" style="background:${BCOL[i]}"></span></button>`).join('');
 $('mic').innerHTML=P[pat].mics.map((m,i)=>`<option value="${i}" ${i==mic?'selected':''}>${m[0]}</option>`).join('');drawFR();}
$('mic').onchange=e=>{mic=+e.target.value;drawFR();};$('use').onchange=ui;

function pol(cx,cy,r,th){return [cx+r*Math.sin(th+ROT),cy-r*Math.cos(th+ROT)];}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function metal(g,y0,y1,a,b){const gr=g.createLinearGradient(0,y0,0,y1);gr.addColorStop(0,b);gr.addColorStop(.35,a);gr.addColorStop(1,b);return gr;}
function metalX(g,x0,x1,a,b){const gr=g.createLinearGradient(x0,0,x1,0);gr.addColorStop(0,b);gr.addColorStop(.45,a);gr.addColorStop(1,b);return gr;}
function line(g,pts,w,col){g.lineWidth=w;g.strokeStyle=col;g.lineCap='round';g.lineJoin='round';g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.stroke();g.lineCap='butt';}
function paper(g,W,H,cx,cy){const gr=g.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.75);
 gr.addColorStop(0,'#fbf0cf');gr.addColorStop(.55,'#efd79d');gr.addColorStop(1,'#c99a55');g.fillStyle=gr;g.fillRect(0,0,W,H);}

// ---- mic drawings: local coords, front (0° side) at x=0, body toward -x ----
function lav(g,o){ // o: len,r,col,cap,clip:'croc'|'tie'|'vamp'
 line(g,[[-o.len+2,0],[-o.len-70,8],[-o.len-120,60],[-o.len-190,58]],4.5,'#1d1e21');
 if(o.clip==='tie'){g.fillStyle=metal(g,10,30,'#d4d6d9','#8e9196');rr(g,-o.len-14,o.r-2,o.len+4,14,3);g.fill();g.fillStyle='#777';g.fillRect(-o.len-14,o.r+10,o.len+4,3);}
 else if(o.clip==='vamp'){g.fillStyle='#24262a';rr(g,-o.len-8,o.r-1,o.len-4,10,2);g.fill();g.fillStyle='#3a3d42';g.fillRect(-o.len-8,o.r+7,8,8);}
 else{g.fillStyle='#55595f';g.fillRect(-o.len-6,o.r-2,o.len-6,8);for(let i=-o.len-4;i<-12;i+=5){g.fillStyle='#33363b';g.fillRect(i,o.r+6,3,5);}}
 g.fillStyle=metal(g,-o.r,o.r,o.col,'#0d0e10');rr(g,-o.len,-o.r,o.len,o.r*2,Math.min(5,o.r*.5));g.fill();
 g.fillStyle=o.cap;g.fillRect(-5,-o.r+1,5,o.r*2-2);g.fillStyle='#ffffff22';for(let j=-o.r+3;j<o.r-2;j+=3)g.fillRect(-4,j,3,1);}
function pencil(g,o){ // o: len,head,r,body,bodyDark,headCol,headDark,ring
 line(g,[[-o.len*.55,o.r+19],[-o.len*.55,70],[-o.len-30,70]],6,'#3a3f4a');
 g.fillStyle=metal(g,-o.r,o.r,o.body,o.bodyDark);g.fillRect(-o.len,-o.r,o.len-o.head,o.r*2);
 g.fillStyle='#777';g.fillRect(-o.len-7,-o.r*.55,7,o.r*1.1);
